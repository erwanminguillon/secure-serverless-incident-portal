name: Deploy Frontend - web-ssip-dev-frc-01

on:
  push:
    branches:
      - main
    paths:
      - "src/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

env:
  WEB_APP_NAME: web-ssip-dev-frc-01
  FRONTEND_DIR: src/frontend
  NODE_VERSION: "22.x"
  VITE_API_BASE_URL: https://func-ssip-dev-frc-01-bhe9gsg3fmfkcneh.francecentral-01.azurewebsites.net/api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Write production environment file
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          echo "VITE_API_BASE_URL=${VITE_API_BASE_URL}" > .env.production

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm run build -- --mode production

      - name: Create frontend.zip from dist contents
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          python - <<'PY'
          import os
          import zipfile

          source = "dist"
          out = "frontend.zip"

          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk(source):
                  for file in files:
                      full = os.path.join(root, file)
                      arc = os.path.relpath(full, source).replace(os.sep, "/")
                      z.write(full, arc)

          print(f"Created {out}")
          PY

      - name: Validate frontend.zip contents
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          python - <<'PY'
          import sys
          import zipfile

          with zipfile.ZipFile("frontend.zip") as z:
              names = set(z.namelist())
              index_html = z.read("index.html").decode("utf-8", errors="ignore") if "index.html" in names else ""

          if "index.html" not in names:
              print("ERROR: frontend.zip does not contain index.html")
              sys.exit(1)

          if any(name.startswith("src/") for name in names):
              print("ERROR: frontend.zip contains source files under src/")
              sys.exit(1)

          if "package.json" in names:
              print("ERROR: frontend.zip contains package.json")
              sys.exit(1)

          if "/src/main.tsx" in index_html:
              print("ERROR: index.html references /src/main.tsx")
              sys.exit(1)

          if "/assets/" not in index_html:
              print("ERROR: index.html does not reference built /assets/ files")
              sys.exit(1)

          print("frontend.zip validation passed.")
          PY

      - name: Upload frontend.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend.zip
          path: src/frontend/frontend.zip

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8443B015B2FB4E17903FD81190B9815F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_395DBC5140AC446DA3FDBD1055A84D64 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C20094CC2D4E4D419D070C510496A7A9 }}

      - name: Deploy frontend.zip to Azure Web App
        run: |
          az webapp deploy \
            --resource-group rg-ssip-dev-frc-01 \
            --name "${WEB_APP_NAME}" \
            --src-path "${FRONTEND_DIR}/frontend.zip" \
            --type zip

      - name: Restart frontend Web App
        run: |
          az webapp restart \
            --resource-group rg-ssip-dev-frc-01 \
            --name "${WEB_APP_NAME}"

      - name: Verify deployed frontend HTML
        run: |
          URL="https://web-ssip-dev-frc-01-ggf2befba7bzgtgq.francecentral-01.azurewebsites.net/"
          HTML="$(curl -fsS "$URL")"

          if echo "$HTML" | grep -q "/src/main.tsx"; then
            echo "ERROR: deployed frontend references /src/main.tsx"
            exit 1
          fi

          if ! echo "$HTML" | grep -q "/assets/"; then
            echo "ERROR: deployed frontend does not reference /assets/"
            exit 1
          fi

          echo "Frontend smoke test passed."